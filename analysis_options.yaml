# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/generated_plugin_registrant.dart"
  
  errors:
    # Treat missing required parameters as warnings instead of errors
    missing_required_param: warning
    # Treat missing return types as warnings
    always_declare_return_types: ignore
    # Allow TODO comments
    todo: ignore

linter:
  rules:
    # Disable some strict rules that generate many warnings
    avoid_print: false
    prefer_single_quotes: false
    require_trailing_commas: false
    
    # Disable documentation requirements (common source of many warnings)
    public_member_api_docs: false
    
    # Disable some formatting rules
    lines_longer_than_80_chars: false
    
    # Allow unused elements (common in development)
    unused_element: false
    unused_field: false
    unused_import: false
    unused_local_variable: false
    
    # Disable const requirements (can be added later)
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    
    # Allow dynamic types
    avoid_dynamic_calls: false
    
    # Disable some pedantic rules
    avoid_redundant_argument_values: false
    prefer_final_locals: false
    prefer_final_in_for_each: false
