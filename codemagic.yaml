workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.7
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate code with build_runner
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        script: |
          flutter build apk --debug --verbose --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.7
      java: 17
      groups:
        - firebase_config
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate code with build_runner
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
      - name: Build release APK
        script: |
          flutter build apk --release --verbose --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true

  ios-debug:
    name: iOS Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate code with build_runner
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS debug
        script: |
          flutter build ios --debug --no-codesign --verbose
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true