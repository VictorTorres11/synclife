name: synclife_app
description: "SyncLife - Collaborative task management with gamification"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  
  # Location & Timezone
  geolocator: ^10.1.0
  timezone: ^0.9.2
  
  # UI & Navigation
  go_router: ^12.1.3
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.2.2
  
  # Offline & Sync
  sqflite: ^2.3.0
  connectivity_plus: ^5.0.2
  path: ^1.8.3
  
  # In-App Purchases & Monetization
  in_app_purchase: ^3.1.13
  google_mobile_ads: ^5.1.0
  
  # Development
  cupertino_icons: ^1.0.2
  equatable: ^2.0.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.7
  fake_async: ^1.3.1
  fake_cloud_firestore: ^3.1.0
  
  # Code Generation
  riverpod_generator: ^2.3.9
  
  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/