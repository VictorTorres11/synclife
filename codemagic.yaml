workflows:
  # Workflow principal para Android
  android-workflow:
    name: SyncLife Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - firebase_config
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
      - name: Run unit tests (basic)
        script: |
          flutter test test/core/build/ --reporter expanded || true
          flutter test test/core/performance/ --reporter expanded || true
        ignore_failure: true
      - name: Build debug APK
        script: |
          flutter build apk --debug --no-tree-shake-icons
      - name: Build release APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true

  # Workflow simplificado para testes rápidos
  android-debug-simple:
    name: SyncLife Android Debug (Quick)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build debug APK (skip tests)
        script: |
          flutter build apk --debug --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true

  # Workflow para web (opcional)
  web-workflow:
    name: SyncLife Web Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build web
        script: |
          flutter build web --release
    artifacts:
      - build/web/**
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true