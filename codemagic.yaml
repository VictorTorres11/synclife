  android-aab-simple:
    name: Android AAB Simple (Google Play)
    max_build_duration: 90
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.7
      java: 17
      groups:
        - firebase_config
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Setup keystore directory
        script: |
          mkdir -p android/keystore
          echo "Keystore directory created"
      - name: Generate keystore directly
        script: |
          echo "Generating keystore with keytool..."
          keytool -genkey -v \
            -keystore android/keystore/synclife-release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias synclife-key \
            -storepass synclife123 \
            -keypass synclife123 \
            -dname "CN=SyncLife, OU=Development, O=SyncLife, L=City, S=State, C=BR"
          
          if [ -f "android/keystore/synclife-release-key.jks" ]; then
            echo "✅ Keystore generated successfully"
            ls -la android/keystore/
          else
            echo "❌ Keystore generation failed"
            exit 1
          fi
      - name: Create key.properties
        script: |
          cat > android/key.properties << EOF
          storePassword=synclife123
          keyPassword=synclife123
          keyAlias=synclife-key
          storeFile=keystore/synclife-release-key.jks
          EOF
          echo "✅ key.properties created"
          cat android/key.properties
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate code with build_runner
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Pre-download Gradle dependencies
        script: |
          cd android
          ./gradlew dependencies --no-daemon --stacktrace || echo "Dependency download completed"
      - name: Build Android App Bundle (AAB)
        script: |
          echo "Building AAB with proper keystore signing"
          flutter build appbundle --release --verbose --no-tree-shake-icons
      - name: Verify AAB was created
        script: |
          ls -la build/app/outputs/bundle/release/
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ AAB created successfully"
            file build/app/outputs/bundle/release/app-release.aab
            echo "✅ AAB is ready for Google Play Console upload"
          else
            echo "❌ AAB not found"
            exit 1
          fi
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/**/mapping.txt
      - android/keystore/*.jks
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true

  android-aab-release:
    name: Android AAB Release (Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.7
      java: 17
      groups:
        - firebase_config
        - keystore_credentials
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Create keystore directory
        script: |
          mkdir -p android/keystore
      - name: Generate or use existing keystore
        script: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using provided keystore from environment"
            echo $KEYSTORE_BASE64 | base64 -d > android/keystore/synclife-release-key.jks
          else
            echo "Generating new keystore"
            keytool -genkey -v \
              -keystore android/keystore/synclife-release-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias ${KEY_ALIAS:-synclife-key} \
              -storepass ${KEYSTORE_PASSWORD:-synclife123} \
              -keypass ${KEY_PASSWORD:-synclife123} \
              -dname "CN=SyncLife, OU=Development, O=SyncLife, L=City, S=State, C=BR"
          fi
      - name: Create key.properties
        script: |
          cat > android/key.properties << EOF
          storePassword=${KEYSTORE_PASSWORD:-synclife123}
          keyPassword=${KEY_PASSWORD:-synclife123}
          keyAlias=${KEY_ALIAS:-synclife-key}
          storeFile=keystore/synclife-release-key.jks
          EOF
      - name: Verify keystore exists
        script: |
          if [ -f "android/keystore/synclife-release-key.jks" ]; then
            echo "✅ Keystore found at android/keystore/synclife-release-key.jks"
            ls -la android/keystore/
          else
            echo "❌ Keystore not found!"
            exit 1
          fi
      - name: Verify key.properties exists
        script: |
          if [ -f "android/key.properties" ]; then
            echo "✅ key.properties found"
            cat android/key.properties
          else
            echo "❌ key.properties not found!"
            exit 1
          fi
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate code with build_runner
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        script: |
          flutter test || echo "Tests failed but continuing build"
      - name: Build Android App Bundle (AAB)
        script: |
          flutter build appbundle --release --verbose
      - name: Verify AAB was created
        script: |
          ls -la build/app/outputs/bundle/release/
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ AAB created successfully"
            file build/app/outputs/bundle/release/app-release.aab
          else
            echo "❌ AAB not found"
            exit 1
          fi
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/**/mapping.txt
      - android/keystore/*.jks
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true

  code-analysis:
    name: Code Analysis (Non-blocking)
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.7
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate code with build_runner
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Flutter analyze (informational)
        script: |
          echo "Running Flutter analyze - issues are informational only"
          flutter analyze --no-fatal-infos || echo "Analysis completed with issues - not blocking build"
      - name: Dart format check
        script: |
          dart format --set-exit-if-changed . || echo "Format issues found - not blocking build"
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: false
          failure: true

  ios-debug:
    name: iOS Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.38.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate code with build_runner
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS debug
        script: |
          flutter build ios --debug --no-codesign --verbose
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - victor@synclife.app
        notify:
          success: true
          failure: true