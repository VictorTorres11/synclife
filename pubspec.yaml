name: synclife_app
description: "SyncLife - Collaborative task management with gamification"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter
  go_router: ^12.1.3
  intl: any
  shared_preferences: ^2.2.2
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Firebase
  cloud_firestore: ^5.4.3
  firebase_analytics: ^11.3.3
  firebase_auth: ^5.7.0
  firebase_core: ^3.15.2
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.2.10
  firebase_performance: ^0.10.1+10
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  
  # Location & Timezone
  geolocator: ^10.1.1
  timezone: ^0.9.4
  
  # Offline & Sync
  connectivity_plus: ^5.0.2
  path: ^1.8.3
  sqflite: ^2.3.0
  
  # In-App Purchases & Monetization
  google_mobile_ads: ^5.3.1
  in_app_purchase: ^3.1.13
  
  # Development
  equatable: ^2.0.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.6.5
  
  # Testing
  fake_async: ^1.3.1
  fake_cloud_firestore: ^3.1.0
  mockito: ^5.4.6
  
  # Linting
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/